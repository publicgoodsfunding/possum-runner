name: ci
run-name: ci for ${{ inputs.possum-run }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The possum commit to check out.
        required: true
        type: string
      status-sha:
        description: The possum commit to report ci-status on.
        required: true
        type: string
      force:
        description: Rebuild every recipe instead of reusing earlier runs' builds.
        type: boolean
        default: false
      possum-run:
        description: The URL of the possum run that dispatched this one.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ inputs.status-sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - &possum-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: possum-token
        with:
          client-id: ${{ secrets.POSSUM_APP_CLIENT_ID }}
          private-key: ${{ secrets.POSSUM_APP_PRIVATE_KEY }}
          owner: publicgoodsfunding
          repositories: possum
          permission-contents: read
      - &possum-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: publicgoodsfunding/possum
          ref: ${{ inputs.sha }}
          token: ${{ steps.possum-token.outputs.token }}
          persist-credentials: false
      - uses: ./.github/actions/possum-setup
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run possum validate
      - run: uv run possum validate eval/cases

  plan:
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.plan.outputs.recipes }}
      builds: ${{ steps.plan.outputs.builds }}
      unpatched: ${{ steps.plan.outputs.unpatched }}
    steps:
      - *possum-token
      - *possum-checkout
      - uses: ./.github/actions/possum-setup
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--cadence "$(date -u +%G-W%V)" --github-output "$GITHUB_OUTPUT")
          if [ "$FORCE" = true ]; then
            args+=(--force)
          fi
          uv run possum ci-plan "${args[@]}"

  unpatched:
    name: unpatched ${{ matrix.entry.dir }}
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.unpatched != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.unpatched) }}
    steps:
      - *possum-token
      - *possum-checkout
      - uses: ./.github/actions/possum-setup
      - env:
          RECIPE: ${{ matrix.entry.dir }}
        run: uv run possum build "$RECIPE" --unpatched --out out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.entry.artifact }}
          path: |
            out/test-results.json
            out/build.log
          if-no-files-found: error
          retention-days: 14
      - if: failure()
        run: tail -n 300 out/build.log

  build:
    name: build ${{ matrix.entry.dir }}
    needs: [plan, unpatched]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.builds != '[]' && needs.unpatched.result != 'failure' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.builds) }}
    env:
      UNPATCHED: ${{ matrix.entry.unpatched_artifact }}
    steps:
      - *possum-token
      - *possum-checkout
      - uses: ./.github/actions/possum-setup
      - if: ${{ matrix.entry.unpatched_artifact }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run possum ci-fetch "$UNPATCHED" --into unpatched
      - env:
          RECIPE: ${{ matrix.entry.dir }}
        run: |
          args=(--out out)
          if [ -n "$UNPATCHED" ]; then
            args+=(--unpatched-results "unpatched/$UNPATCHED/test-results.json")
          fi
          uv run possum build "$RECIPE" "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.entry.artifact }}
          path: |
            out/*.deb
            out/*.rpm
            out/test-results.json
            out/build.log
          if-no-files-found: error
          retention-days: 14
      - if: failure()
        run: tail -n 300 out/build.log

  verify-cves:
    needs: [plan, unpatched, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - *possum-token
      - *possum-checkout
      - uses: ./.github/actions/possum-setup
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          RECIPES: ${{ needs.plan.outputs.recipes }}
        run: jq -r '.[].artifact' <<<"$RECIPES" | xargs uv run possum ci-fetch --into artifacts
      - run: uv run pytest -m network cli/tests/test_verify.py
      - env:
          RECIPES: ${{ needs.plan.outputs.recipes }}
        run: |
          failed=0
          ran=0
          while read -r dir artifact; do
            ran=$((ran + 1))
            uv run possum verify-cves "$dir" --packages "artifacts/$artifact" || failed=1
            case "$dir" in
              recipes/curl/*)
                POSSUM_SELFTEST_RECIPE="$dir" POSSUM_SELFTEST_PACKAGES="artifacts/$artifact" \
                  uv run pytest -m network cli/tests/test_verify_selftest.py || failed=1
                ;;
            esac
          done < <(jq -r '.[] | "\(.dir) \(.artifact)"' <<<"$RECIPES")
          if [ "$ran" -eq 0 ]; then
            echo "no recipes to verify"
            exit 1
          fi
          exit "$failed"

  publish-smoke:
    needs: [plan, unpatched, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    env:
      POSSUM_URL: http://localhost:8000
    steps:
      - *possum-token
      - *possum-checkout
      - uses: ./.github/actions/possum-setup
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          RECIPES: ${{ needs.plan.outputs.recipes }}
        run: jq -r '.[].artifact' <<<"$RECIPES" | xargs uv run possum ci-fetch --into packages
      - name: Publish with a throwaway key
        run: |
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --pinentry-mode loopback --passphrase ci-passphrase \
            --quick-generate-key "Possum CI <ci@possum.invalid>" rsa3072 sign never
          POSSUM_GPG_PRIVATE_KEY="$(gpg --batch --pinentry-mode loopback --passphrase ci-passphrase --armor --export-secret-keys)"
          unset GNUPGHOME
          export POSSUM_GPG_PRIVATE_KEY POSSUM_GPG_PASSPHRASE=ci-passphrase
          uv run possum publish --packages packages --recipes recipes --dist dist --base-url "$POSSUM_URL"
      - name: Check the catalog
        env:
          RECIPES: ${{ needs.plan.outputs.recipes }}
        run: |
          dirs=$(jq -r '.[].dir' <<<"$RECIPES")
          test -n "$dirs"
          POSSUM_SMOKE_DIST=dist POSSUM_SMOKE_RECIPES="$dirs" \
            uv run pytest cli/tests/test_catalog_smoke.py
      - name: Serve the tree
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory dist &
          curl --retry 10 --retry-connrefused --fail --silent --output /dev/null "$POSSUM_URL/possum.asc"
      - name: Install from the README on Debian 12
        run: |
          awk '/^```bash install-debian$/{f=1;next} /^```$/{f=0} f' README.md > "$RUNNER_TEMP/install-debian.sh"
          command -v podman >/dev/null && CLI=podman || CLI=docker
          "$CLI" run --rm --network host -e POSSUM_URL \
            -v "$RUNNER_TEMP/install-debian.sh:/install.sh:ro" \
            mirror.gcr.io/library/debian:12 sh -eux -c '
              echo "APT::Get::Assume-Yes \"true\";" > /etc/apt/apt.conf.d/99assume-yes
              apt-get update
              apt-get install curl ca-certificates
              sh -eux /install.sh
              installed=$(dpkg-query -W -f="\${Package} \${Version}\n" curl libcurl4)
              echo "$installed"
              [ "$(echo "$installed" | grep -Ec "\+pss[0-9]+$")" = 2 ]
            '
      - name: Install from the README on Rocky Linux 9
        run: |
          awk '/^```bash install-rocky$/{f=1;next} /^```$/{f=0} f' README.md > "$RUNNER_TEMP/install-rocky.sh"
          command -v podman >/dev/null && CLI=podman || CLI=docker
          "$CLI" run --rm --network host -e POSSUM_URL \
            -v "$RUNNER_TEMP/install-rocky.sh:/install.sh:ro" \
            quay.io/rockylinux/rockylinux:9 sh -eux -c '
              echo assumeyes=1 >> /etc/dnf/dnf.conf
              sh -eux /install.sh
              installed=$(rpm -q --qf "%{NAME} %{VERSION}-%{RELEASE}\n" curl-minimal libcurl-minimal)
              echo "$installed"
              [ "$(echo "$installed" | grep -Ec "\.pss[0-9]+$")" = 2 ]
            '

  # A run cancelled by a newer one for the same commit must not overwrite that run's status. Inside a job that
  # always() started, cancelled() stays false, so the check has to be the job's own condition.
  # ponytail: a cancelled run leaves ci-status as it was, and its run/* branch to sweep.yml
  ci-status:
    needs: [ci, plan, unpatched, build, verify-cves, publish-smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - id: result
        if: ${{ always() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
          OK: >-
            ${{ needs.ci.result == 'success'
            && needs.plan.result == 'success'
            && needs.verify-cves.result == 'success'
            && needs.publish-smoke.result == 'success'
            && (needs.unpatched.result == 'success' || (needs.unpatched.result == 'skipped' && needs.plan.outputs.unpatched == '[]'))
            && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.plan.outputs.builds == '[]')) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          echo "state=$([ "$OK" = true ] && echo success || echo failure)" >> "$GITHUB_OUTPUT"
      - *possum-token
      - *possum-checkout
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: status-token
        with:
          client-id: ${{ secrets.POSSUM_APP_CLIENT_ID }}
          private-key: ${{ secrets.POSSUM_APP_PRIVATE_KEY }}
          owner: publicgoodsfunding
          repositories: possum
          permission-statuses: write
      - uses: ./.github/actions/runner-status
        with:
          token: ${{ steps.status-token.outputs.token }}
          sha: ${{ inputs.status-sha }}
          context: ci-status
          state: ${{ steps.result.outputs.state }}
          target-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: possum-runner CI
      - name: Delete this run's branch
        if: ${{ always() && startsWith(github.ref, 'refs/heads/run/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run finds the branch already gone.
          if ! out=$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" 2>&1); then
            echo "$out"
            case "$out" in
              *"(HTTP 404)"* | *"(HTTP 422)"*) ;;
              *) exit 1 ;;
            esac
          fi
      - env:
          STATE: ${{ steps.result.outputs.state }}
        run: '[ "$STATE" = success ]'
